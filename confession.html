<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lưu bút Thành viên - HLS ĐHBK Hà Nội</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
                        serif: ['"Lora"', 'Georgia', 'serif']
                    }
                }
            }
        };
    </script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-white text-neutral-950 font-sans antialiased min-h-screen flex flex-col selection:bg-red-700 selection:text-white">

    <!-- Thanh điều hướng tối giản đầu trang -->
    <nav class="bg-white/95 backdrop-blur-sm border-b border-neutral-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="phong-truyen-thong.html"
                class="text-sm font-medium text-neutral-600 hover:text-red-700 transition-colors flex items-center gap-2">
                <span>&larr;</span>
                <span>Phòng truyền thống HLS</span>
            </a>

            <a href="index.html" class="flex items-center gap-2">
                <span class="w-1.5 h-4 bg-red-700 inline-block"></span>
                <span class="text-sm font-extrabold uppercase tracking-tight text-neutral-950">
                    HLS <span class="font-medium text-neutral-500">Logistics</span>
                </span>
            </a>
        </div>
    </nav>

    <!-- Khu vực nội dung chính -->
    <main class="flex-1 py-12 md:py-16 px-4 sm:px-6">
        <div id="confession-container" class="max-w-5xl mx-auto">
            <div class="text-center py-20 text-neutral-500 text-sm">
                <div class="inline-block w-7 h-7 border-2 border-neutral-200 border-t-red-700 rounded-full animate-spin mb-3"></div>
                <p>Đang tải trang lưu bút...</p>
            </div>
        </div>
    </main>

    <!-- Chân trang -->
    <footer class="bg-[#F7F7F5] border-t border-neutral-200 py-6 px-4 text-center text-xs text-neutral-500">
        &copy; 2026 HLS — CLB Logistics và Quản lý chuỗi cung ứng Đại học Bách Khoa Hà Nội
    </footer>

    <!-- Nhúng cấu hình & dịch vụ -->
    <script src="js/supabase-config.js"></script>
    <script src="js/hall-of-fame-service.js"></script>

    <script>
        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatParagraphs(text) {
            const raw = String(text || "").trim();
            if (!raw) {
                return `<p class="italic text-neutral-500">Thành viên này đang cập nhật lưu bút gửi tới đại gia đình HLS.</p>`;
            }
            return raw
                .split(/\n\s*\n/)
                .map((para) => `<p class="leading-[1.88] text-neutral-700">${escapeHtml(para).replace(/\n/g, "<br>")}</p>`)
                .join("");
        }

        async function loadConfessionPage() {
            const container = document.getElementById("confession-container");
            const params = new URLSearchParams(window.location.search);
            const memberId = params.get("id");

            if (!memberId) {
                container.innerHTML = `
                    <div class="bg-[#F7F7F5] border border-neutral-200 rounded-lg p-10 text-center max-w-md mx-auto">
                        <h1 class="text-xl font-bold text-neutral-950 mb-2">Chưa chọn hồ sơ thành viên</h1>
                        <p class="text-neutral-600 text-sm mb-6">Vui lòng quay lại Phòng truyền thống và chọn một thành viên để xem lưu bút.</p>
                        <a href="phong-truyen-thong.html" class="inline-block bg-neutral-950 hover:bg-red-700 text-white text-sm font-semibold px-6 py-2.5 rounded-md transition-colors">
                            Về Phòng truyền thống
                        </a>
                    </div>
                `;
                return;
            }

            try {
                const [member, allMembers] = await Promise.all([
                    HLSService.getMemberById(memberId),
                    HLSService.getMembers()
                ]);

                if (!member) {
                    container.innerHTML = `
                        <div class="bg-[#F7F7F5] border border-neutral-200 rounded-lg p-10 text-center max-w-md mx-auto">
                            <h1 class="text-xl font-bold text-neutral-950 mb-2">Không tìm thấy hồ sơ</h1>
                            <p class="text-neutral-600 text-sm mb-6">Hồ sơ thành viên này có thể đã được thay đổi hoặc xóa.</p>
                            <a href="phong-truyen-thong.html" class="inline-block bg-neutral-950 hover:bg-red-700 text-white text-sm font-semibold px-6 py-2.5 rounded-md transition-colors">
                                Về Phòng truyền thống
                            </a>
                        </div>
                    `;
                    return;
                }

                document.title = `${member.name} — Lưu bút Phòng Truyền Thống HLS`;
                const tierMeta = HLSService.getTierMeta(member.tier);

                // Các thành viên cùng Gen
                const peers = allMembers
                    .filter((m) => Number(m.gen) === Number(member.gen) && String(m.id) !== String(member.id))
                    .slice(0, 4);

                const peersHtml = peers.length
                    ? `
                    <section class="mt-20 pt-12 border-t border-neutral-200">
                        <div class="flex items-baseline justify-between mb-8">
                            <div>
                                <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-red-700">Cùng thế hệ</span>
                                <h2 class="text-xl font-extrabold text-neutral-950 mt-1">
                                    Đồng đội Gen ${escapeHtml(member.gen)}
                                </h2>
                            </div>
                            <a href="phong-truyen-thong.html" class="text-xs font-semibold text-neutral-600 hover:text-red-700 transition-colors">
                                Xem tất cả &rarr;
                            </a>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
                            ${peers.map((p) => `
                                <a href="confession.html?id=${encodeURIComponent(p.id)}"
                                   class="group bg-white border border-neutral-200 hover:border-neutral-950 rounded-lg overflow-hidden flex items-center sm:flex-col p-3 sm:p-0 gap-3 sm:gap-0 transition-colors">
                                    <div class="w-16 h-20 sm:w-full sm:h-48 overflow-hidden bg-neutral-100 rounded sm:rounded-none flex-shrink-0">
                                        <img src="${escapeHtml(p.avatar_url)}"
                                             alt="${escapeHtml(p.name)}"
                                             onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name || "HLS")}&background=111111&color=ffffff&size=256&bold=true';"
                                             class="w-full h-full object-cover object-top group-hover:scale-[1.03] transition-transform duration-500">
                                    </div>
                                    <div class="sm:p-3.5 text-left w-full">
                                        <div class="text-[10px] font-semibold uppercase tracking-wider text-red-700 line-clamp-1">${escapeHtml(p.role)}</div>
                                        <div class="text-sm font-bold text-neutral-950 group-hover:text-red-700 transition-colors mt-0.5 line-clamp-1">${escapeHtml(p.name)}</div>
                                    </div>
                                </a>
                            `).join("")}
                        </div>
                    </section>
                    `
                    : "";

                container.innerHTML = `
                    <article class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-14 items-start">

                        <!-- Cột trái: Chân dung & Thông tin hồ sơ -->
                        <aside class="lg:col-span-4 lg:sticky lg:top-24">
                            <div class="bg-[#F7F7F5] p-2.5 border border-neutral-200 rounded-lg mb-6">
                                <div class="aspect-[3/4] w-full overflow-hidden rounded bg-neutral-200">
                                    <img src="${escapeHtml(member.avatar_url)}"
                                         alt="${escapeHtml(member.name)}"
                                         onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(member.name || "HLS")}&background=111111&color=ffffff&size=512&bold=true';"
                                         class="w-full h-full object-cover object-top">
                                </div>
                            </div>

                            <div class="mb-5">
                                <h1 class="text-2xl font-extrabold text-neutral-950 tracking-tight">
                                    ${escapeHtml(member.name)}
                                </h1>
                                <p class="text-sm font-semibold text-red-700 mt-1">
                                    ${escapeHtml(member.role || "Thành viên HLS")}
                                </p>
                            </div>

                            <dl class="border-t border-b border-neutral-200 divide-y divide-neutral-200 text-xs">
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-neutral-500">Thế hệ</dt>
                                    <dd class="font-semibold text-neutral-950 text-right">Gen ${escapeHtml(member.gen)}${member.term ? " (" + escapeHtml(member.term) + ")" : ""}</dd>
                                </div>
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-neutral-500">Cấp bậc</dt>
                                    <dd class="font-semibold text-neutral-950 text-right">${escapeHtml(tierMeta.name)}</dd>
                                </div>
                                ${member.department ? `
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-neutral-500">Ban chuyên trách</dt>
                                    <dd class="font-semibold text-neutral-950 text-right">${escapeHtml(member.department)}</dd>
                                </div>` : ""}
                                ${member.cohort ? `
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-neutral-500">Thông tin khóa</dt>
                                    <dd class="font-semibold text-neutral-950 text-right">${escapeHtml(member.cohort)}</dd>
                                </div>` : ""}
                            </dl>
                        </aside>

                        <!-- Cột phải: Tâm thư / Confession -->
                        <div class="lg:col-span-8">
                            <div class="flex items-center gap-3 mb-4">
                                <span class="w-6 h-[2px] bg-red-700"></span>
                                <span class="text-xs font-semibold uppercase tracking-[0.2em] text-red-700">
                                    Lưu bút &amp; Confession thành viên
                                </span>
                            </div>

                            <h2 class="text-2xl sm:text-4xl font-extrabold text-neutral-950 tracking-tight leading-[1.2] mb-8">
                                ${escapeHtml(member.confession_title || `Gửi đại gia đình HLS từ ${member.name}`)}
                            </h2>

                            ${member.quote ? `
                                <blockquote class="bg-[#F7F7F5] border-l-2 border-red-700 px-6 py-4 mb-8">
                                    <p class="font-serif italic text-base sm:text-lg text-neutral-900">“${escapeHtml(member.quote)}”</p>
                                </blockquote>
                            ` : ""}

                            <div class="space-y-6 text-base sm:text-[17px]">
                                ${formatParagraphs(member.confession)}
                            </div>

                            <!-- Chữ ký cuối thư -->
                            <div class="mt-12 pt-8 border-t border-neutral-200 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                                <div class="text-xs text-neutral-400">
                                    Lưu trữ tại Phòng Truyền Thống HLS · Đại học Bách Khoa Hà Nội
                                </div>
                                <div class="sm:text-right">
                                    <p class="font-serif italic text-sm text-neutral-500">Thân gửi HLS,</p>
                                    <p class="text-base font-bold text-neutral-950 mt-1">${escapeHtml(member.name)}</p>
                                    <p class="text-xs text-red-700 font-medium">${escapeHtml(member.role)} · Gen ${escapeHtml(member.gen)}</p>
                                </div>
                            </div>
                        </div>

                    </article>

                    ${peersHtml}
                `;
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-8 text-center max-w-md mx-auto">
                        <p class="text-red-700 font-bold mb-1">Không thể tải lưu bút</p>
                        <p class="text-sm text-neutral-600">${escapeHtml(err.message)}</p>
                    </div>
                `;
            }
        }

        loadConfessionPage();
    </script>
</body>

</html>
