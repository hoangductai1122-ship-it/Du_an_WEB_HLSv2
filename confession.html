<!DOCTYPE html>
<html lang="vi" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lưu bút Thành viên — HLS ĐHBK Hà Nội</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/editorial.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
                        serif: ['"Lora"', 'Georgia', 'serif']
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-[#050507] text-zinc-100 font-sans antialiased min-h-screen flex flex-col selection:bg-red-600 selection:text-white">
    <div id="reading-progress" class="hls-reading-bar"></div>

    <!-- Thanh điều hướng tối giản đầu trang -->
    <nav class="hls-nav sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="phong-truyen-thong.html"
                class="group text-sm font-medium text-zinc-400 hover:text-red-400 transition-colors flex items-center gap-2">
                <span class="transition-transform duration-200 group-hover:-translate-x-0.5">&larr;</span>
                <span>Phòng truyền thống HLS</span>
            </a>

            <div class="flex items-center gap-4">
                <button id="copy-confession-link-btn" type="button"
                    class="hls-btn-obsidian text-xs font-medium rounded px-3 py-1.5">
                    Chia sẻ lưu bút
                </button>
                <a href="index.html" class="flex items-center gap-2">
                    <span data-brand-bar class="w-1.5 h-4 bg-red-600 inline-block shadow-[0_0_8px_rgba(239,68,68,0.65)]"></span>
                    <span class="text-sm font-extrabold uppercase tracking-tight text-white">
                        HLS <span class="font-medium text-zinc-400">Logistics</span>
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Khu vực nội dung chính -->
    <main class="flex-1 py-12 md:py-16 px-4 sm:px-6">
        <div id="confession-container" class="max-w-5xl mx-auto">
            <div class="text-center py-20 text-zinc-500 text-sm">
                <div class="inline-block w-7 h-7 border-2 border-white/15 border-t-red-500 rounded-full animate-spin mb-3"></div>
                <p>Đang tải trang lưu bút...</p>
            </div>
        </div>
    </main>

    <!-- Chân trang -->
    <footer class="bg-[#08080c]/95 border-t border-white/10 py-6 px-4 text-center text-xs text-zinc-500">
        &copy; 2026 HLS — CLB Logistics và Quản lý chuỗi cung ứng Đại học Bách Khoa Hà Nội
    </footer>

    <script src="js/supabase-config.js"></script>
    <script src="js/hall-of-fame-service.js"></script>
    <script src="js/site-content-service.js"></script>
    <script src="js/editorial-ui.js"></script>

    <script>
        document.getElementById("copy-confession-link-btn").addEventListener("click", async (e) => {
            try {
                await navigator.clipboard.writeText(window.location.href);
                e.target.textContent = "Đã sao chép link";
                setTimeout(() => (e.target.textContent = "Chia sẻ lưu bút"), 2000);
            } catch (_) {}
        });

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatParagraphs(text) {
            const raw = (text || "").trim();
            if (!raw) {
                return `<p class="text-zinc-400 italic">Thành viên hiện chưa cập nhật lưu bút chi tiết, nhưng dấu ấn đồng hành cùng HLS luôn còn mãi.</p>`;
            }
            return raw
                .split(/\n\s*\n/)
                .map((p) => `<p class="leading-[1.92] text-zinc-300">${escapeHtml(p).replace(/\n/g, "<br>")}</p>`)
                .join("");
        }

        async function loadConfessionPage() {
            const container = document.getElementById("confession-container");
            const params = new URLSearchParams(window.location.search);
            const memberId = params.get("id");

            if (!memberId) {
                container.innerHTML = `
                    <div class="hls-surface rounded-xl p-10 text-center max-w-md mx-auto">
                        <h1 class="text-xl font-bold text-white mb-2">Chưa chọn hồ sơ thành viên</h1>
                        <p class="text-zinc-400 text-sm mb-6">Vui lòng quay lại Phòng truyền thống và chọn một thành viên để xem lưu bút.</p>
                        <a href="phong-truyen-thong.html" class="hls-btn-crimson inline-block text-sm font-semibold px-6 py-2.5 rounded-md">
                            Về Phòng truyền thống
                        </a>
                    </div>
                `;
                return;
            }

            try {
                const [member, allMembers] = await Promise.all([
                    HLSService.getMemberById(memberId),
                    HLSService.getMembers()
                ]);

                if (!member) {
                    container.innerHTML = `
                        <div class="hls-surface rounded-xl p-10 text-center max-w-md mx-auto">
                            <h1 class="text-xl font-bold text-white mb-2">Không tìm thấy hồ sơ</h1>
                            <p class="text-zinc-400 text-sm mb-6">Hồ sơ thành viên này có thể đã được thay đổi hoặc xóa.</p>
                            <a href="phong-truyen-thong.html" class="hls-btn-crimson inline-block text-sm font-semibold px-6 py-2.5 rounded-md">
                                Về Phòng truyền thống
                            </a>
                        </div>
                    `;
                    return;
                }

                document.title = `${member.name} — Lưu bút Phòng Truyền Thống HLS`;
                const tierMeta = HLSService.getTierMeta(member.tier);

                const peers = allMembers
                    .filter((m) => Number(m.gen) === Number(member.gen) && String(m.id) !== String(member.id))
                    .slice(0, 4);

                const peersHtml = peers.length
                    ? `
                    <section class="mt-20 pt-12 border-t border-white/10">
                        <div class="flex items-baseline justify-between mb-8">
                            <div>
                                <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-red-400">Cùng thế hệ</span>
                                <h2 class="text-xl font-extrabold text-white mt-1">
                                    Đồng đội Gen ${escapeHtml(member.gen)}
                                </h2>
                            </div>
                            <a href="phong-truyen-thong.html" class="text-xs font-semibold text-zinc-400 hover:text-red-400 transition-colors">
                                Xem tất cả &rarr;
                            </a>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
                            ${peers.map((p) => `
                                <a href="confession.html?id=${encodeURIComponent(p.id)}"
                                   class="hls-card group rounded-xl overflow-hidden flex items-center sm:flex-col p-3 sm:p-0 gap-3 sm:gap-0">
                                    <div class="w-16 h-20 sm:w-full sm:h-48 overflow-hidden bg-zinc-900 rounded sm:rounded-none flex-shrink-0">
                                        <img src="${escapeHtml(p.avatar_url)}"
                                             alt="${escapeHtml(p.name)}"
                                             onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name || "HLS")}&background=111116&color=ffffff&size=256&bold=true';"
                                             class="w-full h-full object-cover object-top group-hover:scale-[1.04] transition-transform duration-500">
                                    </div>
                                    <div class="sm:p-3.5 text-left w-full">
                                        <div class="text-[10px] font-semibold uppercase tracking-wider text-red-400 line-clamp-1">${escapeHtml(p.role)}</div>
                                        <div class="text-sm font-bold text-white group-hover:text-red-400 transition-colors mt-0.5 line-clamp-1">${escapeHtml(p.name)}</div>
                                    </div>
                                </a>
                            `).join("")}
                        </div>
                    </section>
                    `
                    : "";

                container.innerHTML = `
                    <article class="hls-fade-swap grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-14 items-start">

                        <aside data-reveal class="lg:col-span-4 lg:sticky lg:top-24">
                            <div class="hls-card border-t-2 border-t-red-600 p-2.5 rounded-xl mb-6">
                                <div class="aspect-[3/4] w-full overflow-hidden rounded-lg bg-zinc-900">
                                    <img src="${escapeHtml(member.avatar_url)}"
                                         alt="${escapeHtml(member.name)}"
                                         onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(member.name || "HLS")}&background=111116&color=ffffff&size=512&bold=true';"
                                         class="w-full h-full object-cover object-top">
                                </div>
                            </div>

                            <div class="mb-5">
                                <h1 class="text-2xl font-extrabold text-white tracking-tight">
                                    ${escapeHtml(member.name)}
                                </h1>
                                <p class="text-sm font-semibold text-red-400 mt-1">
                                    ${escapeHtml(member.role || "Thành viên HLS")}
                                </p>
                            </div>

                            <dl class="border-t border-b border-white/10 divide-y divide-white/10 text-xs">
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-zinc-500">Thế hệ</dt>
                                    <dd class="font-semibold text-white text-right">Gen ${escapeHtml(member.gen)}${member.term ? " (" + escapeHtml(member.term) + ")" : ""}</dd>
                                </div>
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-zinc-500">Cấp bậc</dt>
                                    <dd class="font-semibold text-white text-right">${escapeHtml(tierMeta.name)}</dd>
                                </div>
                                ${member.department ? `
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-zinc-500">Ban chuyên trách</dt>
                                    <dd class="font-semibold text-white text-right">${escapeHtml(member.department)}</dd>
                                </div>` : ""}
                                ${member.cohort ? `
                                <div class="py-2.5 flex justify-between gap-4">
                                    <dt class="text-zinc-500">Thông tin khóa</dt>
                                    <dd class="font-semibold text-white text-right">${escapeHtml(member.cohort)}</dd>
                                </div>` : ""}
                            </dl>
                        </aside>

                        <div data-reveal data-reveal-delay="80" class="lg:col-span-8">
                            <div class="flex items-center gap-3 mb-4">
                                <span class="w-6 h-[2px] bg-red-500"></span>
                                <span class="text-xs font-semibold uppercase tracking-[0.2em] text-red-400">
                                    Lưu bút &amp; Confession thành viên
                                </span>
                            </div>

                            <h2 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight leading-[1.2] mb-8">
                                ${escapeHtml(member.confession_title || `Gửi đại gia đình HLS từ ${member.name}`)}
                            </h2>

                            ${member.quote ? `
                                <blockquote class="hls-surface border-l-2 border-l-red-600 rounded-r-xl px-6 py-4 mb-8">
                                    <p class="font-serif italic text-base sm:text-lg text-zinc-100">“${escapeHtml(member.quote)}”</p>
                                </blockquote>
                            ` : ""}

                            <div class="space-y-6 text-base sm:text-[17px]">
                                ${formatParagraphs(member.confession)}
                            </div>

                            <div class="mt-12 pt-8 border-t border-white/10 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                                <div class="text-xs text-zinc-500">
                                    Lưu trữ tại Phòng Truyền Thống HLS · Đại học Bách Khoa Hà Nội
                                </div>
                                <div class="sm:text-right">
                                    <p class="font-serif italic text-sm text-zinc-400">Thân gửi HLS,</p>
                                    <p class="text-base font-bold text-white mt-1">${escapeHtml(member.name)}</p>
                                    <p class="text-xs text-red-400 font-medium">${escapeHtml(member.role)} · Gen ${escapeHtml(member.gen)}</p>
                                </div>
                            </div>
                        </div>

                    </article>

                    ${peersHtml}
                `;
                if (window.HLSEditorialUI) window.HLSEditorialUI.refresh(container);
            } catch (err) {
                container.innerHTML = `
                    <div class="hls-surface border-red-500/40 rounded-xl p-8 text-center max-w-md mx-auto">
                        <p class="text-red-400 font-bold mb-1">Không thể tải lưu bút</p>
                        <p class="text-sm text-zinc-400">${escapeHtml(err.message)}</p>
                    </div>
                `;
            }
        }

        loadConfessionPage();
    </script>
</body>

</html>
